name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # POSIX only: the transport manages agy as a process group (start_new_session / killpg).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      # The plugin imports Hermes core (providers, tools, hermes_cli) from a checkout, like an installed plugin.
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install hermes-agent
        # ruamel.yaml: imported by hermes-agent core but missing from its package requirements
        run: python -m pip install -e ./hermes-agent pytest ruamel.yaml
      - name: Validate the plugin the way the Hermes catalog CI does
        run: hermes plugins validate ./plugin
      - name: Run the plugin suite (fake agy only; no Antigravity quota is used)
        working-directory: plugin
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
        run: python -m pytest -q
