[project]
name = "hermes-plugin-antigravity-agy"
version = "0.1.0"
description = "Hermes Agent model-provider plugin that drives the official Google Antigravity agy CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# No runtime dependencies: the plugin uses only the standard library and Hermes core.
dependencies = []

[dependency-groups]
# requests/rich/httpx/ruamel.yaml: Hermes CLI modules imported by tests/test_model_switch.py
dev = ["pytest>=8,<10", "pyyaml>=6,<7", "requests>=2,<3", "rich>=13,<16", "httpx>=0.27,<1", "ruamel.yaml>=0.18,<0.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
